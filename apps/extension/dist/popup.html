<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=360" />
  <title>HIVE Wallet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #39ff14;
      --green-dim: rgba(57,255,20,0.55);
      --green-glow: rgba(57,255,20,0.15);
      --gold: #f5b429;
      --bg: #040507;
      --bg2: #07090c;
      --glass: rgba(255,255,255,0.035);
      --glass2: rgba(255,255,255,0.06);
      --border: rgba(57,255,20,0.18);
      --border2: rgba(255,255,255,0.1);
      --text: #e8f0e4;
      --sub: rgba(232,240,228,0.55);
      --danger: #ff5a5a;
      --radius: 12px;
    }
    html, body, #root {
      width: 360px;
      min-height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      overflow-x: hidden;
    }
    #root { display: flex; flex-direction: column; }
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: 14px;
      border-radius: var(--radius);
      padding: 10px 16px;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-green {
      background: var(--green);
      color: #040507;
      font-weight: 700;
      width: 100%;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border2);
      color: var(--sub);
      width: 100%;
    }
    .btn-outline:hover { border-color: var(--green); color: var(--green); }
    .btn-danger {
      background: rgba(255,90,90,0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      width: 100%;
    }
    input, textarea {
      background: var(--glass2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus { border-color: var(--green); }
    input::placeholder, textarea::placeholder { color: var(--sub); }
    .card {
      background: var(--glass2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      padding: 14px;
    }
    .card-green { border-color: var(--border); }
    label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 6px; }
    .mono { font-family: 'Courier New', monospace; font-size: 11px; word-break: break-all; }
  </style>
  <script type="module" crossorigin src="/popup.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
